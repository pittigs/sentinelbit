version: '3.8'

services:
  sentinelbit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelbit
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SENTINELBIT_DATA_DIR=/data
      - SENTINELBIT_PORT=8000
    volumes:
      # Persistente SQLite-Datenbank und automatische Backups
      - ./data:/data
      # Optional: Lokales externes Backup-Ziel einbinden
      - ./backups:/data/backups

