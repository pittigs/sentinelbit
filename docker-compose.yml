services:
  sentinelbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelbit:latest
    container_name: sentinelbit
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - SENTINELBIT_PORT=8000
      - SENTINELBIT_DATA_DIR=/data
      # Nach deiner Erstregistrierung auf 'true' setzen:
      - SENTINELBIT_DISABLE_REGISTRATION=false
      - SENTINELBIT_LOG_LEVEL=info
      # Optional: Google Drive Backup via Env (kann auch bequem im Web-Tresor konfiguriert werden):
      # - SENTINELBIT_GDRIVE_ENABLED=true
      # - SENTINELBIT_GDRIVE_FOLDER_ID=deine-google-drive-ordner-id
      # - SENTINELBIT_GDRIVE_CREDENTIALS_FILE=/data/gdrive-service-account.json
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_proxy"
      traefik.http.routers.sentinelbit.rule: "Host(`vault.pittigs.eu`)"
      traefik.http.routers.sentinelbit.entrypoints: "websecure"
      traefik.http.routers.sentinelbit.tls: "true"
      traefik.http.routers.sentinelbit.tls.certresolver: "http-resolver"
      traefik.http.services.sentinelbit.loadbalancer.server.port: "8000"
      traefik.http.services.sentinelbit.loadbalancer.server.scheme: "http"
    networks:
      - default
      - traefik_proxy
    volumes:
      - sentinelbit-data:/data
      # Optional: Service Account JSON-Schlüsseldatei mounten:
      # - ./gdrive-service-account.json:/data/gdrive-service-account.json:ro

  # HINWEIS: rclone-backup wird nicht mehr benötigt!
  # Google Drive Uploads werden nun nativ direkt von SentinelBit ausgeführt.

volumes:
  sentinelbit-data:

networks:
  default:
  traefik_proxy:
    external: true
