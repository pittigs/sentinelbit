services:
  sentinelbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelbit:latest
    container_name: sentinelbit
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - SENTINELBIT_PORT=8000
      - SENTINELBIT_DATA_DIR=/data
      # Nach deiner Erstregistrierung auf 'true' setzen:
      - SENTINELBIT_DISABLE_REGISTRATION=false
      - SENTINELBIT_LOG_LEVEL=info
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_proxy"
      traefik.http.routers.sentinelbit.rule: "Host(`vault.pittigs.eu`)"
      traefik.http.routers.sentinelbit.entrypoints: "websecure"
      traefik.http.routers.sentinelbit.tls: "true"
      traefik.http.routers.sentinelbit.tls.certresolver: "http-resolver"
      traefik.http.services.sentinelbit.loadbalancer.server.port: "8000"
      traefik.http.services.sentinelbit.loadbalancer.server.scheme: "http"
    networks:
      - default
      - traefik_proxy
    volumes:
      - sentinelbit-data:/data

  rclone-backup:
    image: rclone/rclone:latest
    container_name: sentinelbit_rclone
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - RCLONE_DIR=/data/backups
      - RCLONE_REMOTE=gdrive:SentinelBit-Backups
      - SYNC_INTERVAL=6h
    volumes:
      - sentinelbit-data:/data:ro
      - ./rclone:/config/rclone:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "🚀 [rclone] SentinelBit Google Drive Backup Companion gestartet."
        while true; do
          if [ ! -f /config/rclone/rclone.conf ]; then
            echo "⚠️ [rclone] Keine rclone.conf in ./rclone gefunden! Bitte einmalig 'docker run --rm -it -v $$(pwd)/rclone:/config/rclone rclone/rclone config' ausführen."
            sleep 60
            continue
          fi
          if [ -d "$$RCLONE_DIR" ] && [ "$$(ls -A "$$RCLONE_DIR" 2>/dev/null)" ]; then
            echo "[$$(date '+%Y-%m-%d %H:%M:%S')] Starte Backup-Upload nach $$RCLONE_REMOTE..."
            rclone copy "$$RCLONE_DIR" "$$RCLONE_REMOTE" --verbose
            echo "[$$(date '+%Y-%m-%d %H:%M:%S')] Upload erfolgreich abgeschlossen."
          else
            echo "[$$(date '+%Y-%m-%d %H:%M:%S')] Noch keine Backups in $$RCLONE_DIR vorhanden (im Web-Tresor unter Einstellungen aktivieren). Warte..."
          fi
          echo "[$$(date '+%Y-%m-%d %H:%M:%S')] Nächster Sync in $$SYNC_INTERVAL."
          sleep "$$SYNC_INTERVAL"
        done
    networks:
      - default

volumes:
  sentinelbit-data:

networks:
  default:
  traefik_proxy:
    external: true
