version: '3.8'

services:
  sentinelbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelbit:latest
    container_name: sentinelbit
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SENTINELBIT_DATA_DIR=/data
      - SENTINELBIT_PORT=8000
      # Nach der Erstregistrierung auf 'true' setzen:
      - SENTINELBIT_DISABLE_REGISTRATION=false
      - SENTINELBIT_LOG_LEVEL=info
    volumes:
      # Persistente SQLite-Datenbank und automatische Backups
      - ./data:/data


