name: CI & Build Matrix

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v -race ./...

  build-matrix:
    name: Cross-Compile Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: sentinelbit-linux-amd64
          - os: linux
            arch: arm64
            name: sentinelbit-linux-arm64
          - os: darwin
            arch: amd64
            name: sentinelbit-darwin-amd64
          - os: darwin
            arch: arm64
            name: sentinelbit-darwin-arm64
          - os: windows
            arch: amd64
            name: sentinelbit-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary (${{ matrix.os }}/${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.name }} ./cmd/server

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Test
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sentinelbit:test
