# ==============================================================================
# Sentinelbit - Nginx Reverse-Proxy Vorlage
# ==============================================================================

server {
    listen 80;
    server_name vault.deinedomain.de;

    # Weiterleitung aller HTTP-Anfragen auf HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vault.deinedomain.de;

    # SSL-Zertifikate (z. B. Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vault.deinedomain.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.deinedomain.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client-Upload-Größe für verschlüsselte Anhänge (z. B. bis zu 25 MB)
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Streaming Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
